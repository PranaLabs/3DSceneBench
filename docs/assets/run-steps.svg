<path d="M284.0 165.0L284.0 238.0L298 238.0" stroke="#3f8f5a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M544 92.0L560.0 92.0L560.0 149.0L574 149.0" stroke="#3f8f5a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M544 238.0L560.0 238.0L560.0 181.0L574 181.0" stroke="#3f8f5a" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M820 165.0L850 165.0" stroke="#3f8f5a" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>